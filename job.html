<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>岗位招聘详情 · OfferMate</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell job-detail-page">
      <section class="topbar job-detail-topbar" aria-label="招聘详情页">
        <div>
          <p class="eyebrow">AI 求职智能匹配智能体</p>
          <h1 id="detail-company">星河科技</h1>
          <p id="detail-company-subtitle" class="top-subtitle"></p>
        </div>
        <span class="creator-watermark" aria-hidden="true">许家齐</span>
        <div class="top-actions">
          <a class="secondary-button compact-button nav-link-button" href="./index.html">返回岗位池</a>
          <div class="status-pill">
            <span class="dot"></span>
            招聘详情页面
          </div>
        </div>
      </section>

      <section class="job-detail-hero">
        <div>
          <p class="eyebrow">公司岗位详情</p>
          <h2 id="detail-title"></h2>
          <p id="detail-meta" class="selected-job-meta"></p>
        </div>
      </section>

      <section class="job-detail-layout">
        <article class="job-detail-main">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">完整 JD</p>
              <h3>岗位描述</h3>
            </div>
          </div>
          <p id="detail-description" class="detail-description"></p>

          <div class="detail-section-grid">
            <section class="detail-card">
              <h3>工作内容</h3>
              <ul id="detail-responsibilities"></ul>
            </section>
            <section class="detail-card">
              <h3>加分方向</h3>
              <div id="detail-nice-to-have" class="tag-list"></div>
            </section>
          </div>

          <section class="detail-card">
            <div class="section-heading compact">
              <div>
                <p class="eyebrow">JD 分析</p>
                <h3>系统从岗位描述中抽取的要求</h3>
              </div>
            </div>
            <div id="detail-jd-analysis" class="detail-analysis-grid"></div>
          </section>
        </article>

        <aside class="job-detail-side">
          <section class="detail-card">
            <div class="section-heading compact">
              <div>
                <p class="eyebrow">岗位概要</p>
                <h3>招聘信息</h3>
              </div>
            </div>
            <div id="detail-summary" class="detail-analysis-grid"></div>
          </section>

          <section class="detail-card">
            <div class="section-heading compact">
              <div>
                <p class="eyebrow">任职要求</p>
                <h3>能力标签</h3>
              </div>
            </div>
            <div id="detail-requirements" class="tag-list"></div>
          </section>

          <section class="detail-card">
            <div class="section-heading compact">
              <div>
                <p class="eyebrow">投递说明</p>
                <h3>候选人准备方向</h3>
              </div>
            </div>
            <ul id="detail-apply-notes"></ul>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="./src/job-detail.js"></script>
  </body>
</html>
